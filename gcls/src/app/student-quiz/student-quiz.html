<div class="main-content-wrapper">
  <div class="container-fluid p-5">
    <div class="row">
      <div
        class="col-11 col-md-10 mx-auto bg-light rounded-4 d-flex justify-content-between align-items-center p-4 mb-5 shadow-sm"
      >
        <div>
          <h2 class="page-title mb-3">COMPUTER SCIENCE, SSS 2</h2>
          <div class="d-flex align-items-center gap-3">
            <span class="badge bg-primary py-2 px-3 fw-bold">STUDENT PORTAL</span>
            <span class="text-muted">|</span>
            <span class="text-muted">Quizzes & Assessments</span>
          </div>
        </div>
        <div class="hand-icon">
          <mat-icon style="transform: scale(2.5)">front_hand</mat-icon>
        </div>
      </div>
    </div>

    <div>
      <div class="row mb-4">
        <div class="col-11 col-md-10 mx-auto">
          <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" *ngFor="let quiz of quizArray">
              <div
                class="card quiz-card h-100 border-0 shadow-sm"
                [class.disabled-card]="getQuizUIState(quiz).disabled"
              >
                <div
                  class="card-img-top pink-header d-flex align-items-center justify-content-center"
                >
                  <img src="assets/white-book.png" alt="Quiz Icon" class="quiz-thumb" />
                </div>

                <div class="card-body p-4">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                      <small class="text-muted fw-bold text-uppercase" style="font-size: 0.7rem"
                        >Quiz: {{ quiz.quiz_title }}</small
                      >
                      <h5 class="card-title fw-bold mt-1 text-uppercase">
                        LESSON: {{ quiz.lesson_topic }}
                      </h5>
                    </div>
                    <button
                      mat-flat-button
                      color="primary"
                      class="open-btn"
                      [disabled]="getQuizUIState(quiz).disabled"
                      (click)="handleQuizAction(quiz)"
                    >
                      {{ getQuizUIState(quiz).label }}
                    </button>
                    <!-- routerLink="/student/quiz/{{ quiz.quiz_id }}" -->
                  </div>

                  <div class="d-flex gap-2 my-3">
                    <span class="stat-badge purple-badge">
                      <span class="count">{{ quiz.questions_count }}</span> Questions
                    </span>
                    <span
                      class="stat-badge animated-badge"
                      *ngIf="quiz.percentage !== null"
                      [ngClass]="{
                        'green-badge': quiz.percentage >= 70,
                        'orange-badge': quiz.percentage >= 50 && quiz.percentage <= 69,
                        'red-badge': quiz.percentage < 50,
                      }"
                    >
                      <span
                        >Score: {{ quiz.percentage }}%
                        <small *ngIf="quiz.percentage >= 70">✔ Mastery</small>
                        <small *ngIf="quiz.percentage >= 50 && quiz.percentage < 70"
                          >⚠ Moderate</small
                        >
                        <small *ngIf="quiz.percentage < 50">❌ Needs Work</small>
                      </span>
                    </span>
                  </div>

                  <p class="text-muted mb-0" style="font-size: 0.65rem">
                    Created on: {{ quiz.created_at | date: 'shortDate' }}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
