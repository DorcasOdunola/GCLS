<div class="container-fluid quiz-review-page py-4">
  <div class="row mb-4">
    <div
      class="col-11 col-lg-10 mx-auto header-card shadow-sm d-flex justify-content-between align-items-center p-3"
    >
      <div>
        <h4 class="mb-1 fw-bold text-dark">QUIZ: {{ quizDetails?.quiz_title }}</h4>
        <p class="mb-0 text-dark">Review Quiz</p>
      </div>
      <mat-icon class="header-hand">front_hand</mat-icon>
    </div>
  </div>

  <div class="row">
    <div class="col-11 col-lg-10 mx-auto d-flex gap-4">
      <div class="sidebar-nav shadow-sm p-4 bg-white rounded">
        <div class="d-flex flex-wrap gap-2 justify-content-start">
          <button
            *ngFor="let q of quizQuestionsArray; let i = index"
            (click)="setActive(q.quiz_question_id)"
            class="nav-num-btn"
            [class.active]="q.quiz_question_id === activeQuestionId"
          >
            {{ i + 1 }}
          </button>
        </div>
      </div>

      <div class="main-review-content flex-grow-1 shadow-sm p-4 bg-white rounded">
        <div *ngFor="let question of quizQuestionsArray; let i = index">
          <div *ngIf="question.quiz_question_id === activeQuestionId">
            <div class="info-alert mb-4">
              <mat-icon>info_outline</mat-icon>
              <span
                >Review your answers to better understand the correct responses and areas for
                improvement.</span
              >
            </div>

            <h5 class="fw-bold mb-1">QUESTION {{ i + 1 }}</h5>
            <p class="text-muted mb-4 fs-5">{{ question.question }}</p>

            <div class="row">
              <div class="col-md-7">
                <div class="d-flex flex-column gap-3">
                  <div
                    *ngFor="let opt of ['a', 'b', 'c', 'd']"
                    class="review-option"
                    [ngClass]="{
                      'correct-highlight': question.correct_option === opt,
                      'wrong-highlight':
                        question.selected_option === opt && opt !== question.correct_option,
                    }"
                  >
                    <span class="opt-badge">{{ opt | uppercase }}</span>
                    <span class="opt-text">{{ question['option_' + opt] }} </span>
                  </div>
                </div>
              </div>

              <div class="col-md-5">
                <div class="feedback-panel h-100 p-4 rounded">
                  <label class="feedback-title d-flex align-items-center mb-3">
                    <mat-icon class="me-2">comment</mat-icon> FEEDBACK
                  </label>
                  <p class="feedback-content lead fs-6 text-dark">
                    {{ question.feedback }}
                  </p>
                </div>
              </div>
            </div>

            <div
              class="review-footer mt-5 pt-4 border-top d-flex justify-content-between align-items-center"
            >
              <button
                class="btn btn-outline-secondary custom-nav-btn d-inline-flex align-items-center"
                (click)="previousQuestion()"
                *ngIf="activeQuestionId !== quizQuestionsArray[0].quiz_question_id"
              >
                <mat-icon>chevron_left</mat-icon>
                <span>Previous</span>
              </button>

              <div class="d-flex gap-2">
                <button
                  class="btn btn-primary next-btn d-inline-flex align-items-center"
                  (click)="nextQuestion()"
                  *ngIf="
                    activeQuestionId !==
                    quizQuestionsArray[quizQuestionsArray.length - 1]?.quiz_question_id
                  "
                >
                  <!-- *ngIf="!isLast" -->
                  <span>Next</span>
                  <mat-icon>chevron_right</mat-icon>
                </button>

                <button
                  class="btn btn-success next-lesson-btn d-inline-flex align-items-center"
                  (click)="goToNextLesson()"
                >
                  <span>Next Lesson</span>
                  <mat-icon>done_all</mat-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
