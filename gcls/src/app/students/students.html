<div class="container-fluid p-5 students-list-page" style="height: 93vh">
  <div class="row">
    <div class="col-11 col-md-9 mx-auto">
      <div class="card header-card border-0 shadow-sm mb-4 rounded-4 bg-white">
        <div class="card-body p-4 d-flex justify-content-between align-items-center">
          <div>
            <h2 class="fw-bold text-dark mb-1">Welcome Onboard!</h2>
            <p class="text-muted small mb-0">Manage your student roster and contact details</p>
          </div>
          <button
            class="btn btn-primary px-4 py-2 d-flex align-items-center rounded-3 shadow-sm"
            (click)="addStudent()"
          >
            <mat-icon class="me-2">person_add</mat-icon> ADD NEW STUDENT
          </button>
        </div>
      </div>
    </div>
    <div class="row col-11 col-md-9 mx-auto mt-4">
      <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
        <div class="table-responsive">
          <table class="table mb-0 align-middle">
            <thead class="bg-light text-secondary text-uppercase small fw-bold">
              <tr>
                <th class="ps-4 py-3">S/N</th>
                <th class="py-3">First Name</th>
                <th class="py-3">Last Name</th>
                <th class="py-3">Phone Number</th>
                <th class="py-3">Email Address</th>
                <th class="py-3">Home Address</th>
                <th class="pe-4 py-3 text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr class="student-row" *ngFor="let student of studentsArray; let i = index">
                <td class="ps-4 fw-bold text-primary">{{ i + 1 }}</td>
                <td>{{ student.first_name }}</td>
                <td>{{ student.last_name }}</td>
                <td>{{ student.phone }}</td>
                <td>{{ student.email }}</td>
                <td class="text-truncate" style="max-width: 200px">{{ student.address }}</td>
                <td class="pe-4 text-end">
                  <button class="btn btn-sm btn-light border-0 me-2">
                    <mat-icon class="small-icon">edit</mat-icon>
                  </button>
                  <button class="btn btn-sm btn-light text-danger border-0">
                    <mat-icon class="small-icon">delete</mat-icon>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
